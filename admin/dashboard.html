<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: #0f172a;
            color: white;
        }

        /* 🔥 Navbar */
        .navbar {
            display: flex;
            justify-content: space-between;
            padding: 15px 25px;
            background: #1e293b;
            align-items: center;
        }

        .navbar h2 {
            margin: 0;
        }

        .logout-btn {
            background: #ef4444;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        /* 🔥 Layout */
        .container {
            padding: 20px;
        }

        /* Cards */
        .card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 14px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }

        .card:hover {
            transform: translateY(-3px);
        }

        /* Buttons */
        .btn {
            padding: 10px 16px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <h2>Admin Dashboard</h2>
        <button class="logout-btn">Logout</button>
    </div>

    <!-- CONTENT -->
    <div class="container">

        <div class="card">
            <h3>Manage Drivers</h3>
            <p>Add or view registered drivers</p>
            <button class="btn btn-primary">View Drivers</button>
        </div>

        <div class="card">
            <h3>Manage Buses</h3>
            <p>Register and assign buses</p>
            <button class="btn btn-primary">Manage Buses</button>
        </div>

        <div class="card">
            <h3>Active Trips</h3>
            <p>Monitor running buses in real-time</p>
            <button class="btn btn-primary">View Trips</button>
        </div>

        <div class="card">
            <h3>SOS Alerts</h3>
            <p>Emergency alerts from drivers</p>
            <button class="btn btn-danger">View Alerts</button>
        </div>

    </div>

</body>

</html>
