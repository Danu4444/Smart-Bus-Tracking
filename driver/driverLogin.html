<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Login</title>
    <link rel="stylesheet" href="../styles.css" />

    <style>
        body.auth-page {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, Segoe UI, Roboto, sans-serif;

            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* 🚍 Animated Bus */
        .bus {
            position: absolute;
            bottom: 40px;
            left: -100px;
            font-size: 40px;
            animation: busMove 15s linear infinite;
            opacity: 0.4;
        }

        @keyframes busMove {
            0% {
                transform: translateX(0);
            }

            30% {
                transform: translateX(30vw);
            }

            40% {
                transform: translateX(30vw);
            }

            70% {
                transform: translateX(70vw);
            }

            80% {
                transform: translateX(70vw);
            }

            100% {
                transform: translateX(110vw);
            }
        }

        /* 🔥 Glass Card */
        .auth-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 30px;
            width: 350px;
            color: white;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        /* Inputs */
        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            font-size: 14px;
            color: #94a3b8;
        }

        .input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            margin-top: 5px;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            transition: 0.3s;
        }

        .input:focus {
            box-shadow: 0 0 10px #2563eb;
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 12px;
            border-radius: 12px;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #4f46e5);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.4);
        }

        /* Back link */
        .auth-back-link {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            text-decoration: none;
        }

        /* Error */
        .error {
            margin-top: 10px;
            color: #ef4444;
            text-align: center;
        }
    </style>

</head>

<body class="auth-page">



    <a id="backLink" href="#" class="auth-back-link">← Back</a>

    <div class="auth-card">
        <h1>Driver Login</h1>
        <p style="text-align:center;color:#94a3b8;">Access your route and vehicle</p>

        <form id="loginForm">
            <div class="input-group">
                <label>Username</label>
                <input type="text" id="username" class="input" placeholder="Username" required />
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" class="input" placeholder="Password" required data-password-toggle autocomplete="current-password" />
            </div>

            <button type="submit" id="loginBtn" class="btn btn-primary">Login</button>
        </form>

        <div id="errorMsg" class="error"></div>
    </div>

    <script src="../js/password-input.js"></script>
    <!-- ⚠️ KEEP YOUR ORIGINAL SCRIPT EXACTLY -->
    <script>
        const isBusTracker = location.pathname.toLowerCase().includes('/bus%20tracker') || location.pathname.toLowerCase().includes('/bus tracker');
        const BASE = isBusTracker ? '/bus tracker' : '';
        document.getElementById('backLink').href = `${BASE}/index.html`;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const err = document.getElementById('errorMsg');

            btn.innerHTML = 'Verifying...';
            btn.disabled = true;
            err.style.display = 'none';

            try {
                const res = await fetch('../api/driverLogin.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'same-origin',
                    body: JSON.stringify({ username: u, password: p })
                });
                const data = await res.json();
                if (res.ok && data.success) {
                    window.location.href = "driver.php";
                } else {
                    err.innerText = data.error || "Login Failed";
                    err.style.display = 'block';
                    btn.innerHTML = 'Login';
                    btn.disabled = false;
                }
            } catch (e) {
                err.innerText = "Network Error";
                err.style.display = 'block';
                btn.innerHTML = 'Login';
                btn.disabled = false;
            }
        });
    </script>

</body>

</html>
